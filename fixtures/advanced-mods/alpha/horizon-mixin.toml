[mod]
id = "alpha"
version = "0.1.0"
priority = 100

[[injection]]
id = "first"
target = "advanced_game::calculate"
kind = "HEAD"
helper = "first.rs"
priority = 300
bindings = [{ name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "cancel"
target = "advanced_game::calculate"
kind = "HEAD"
helper = "cancel.rs"
cancellable = true
priority = 200
bindings = [{ name = "input", ty = "i32", value = "input" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "return"
target = "advanced_game::calculate"
kind = "RETURN"
helper = "return.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "exit-return"
target = "advanced_game::exits"
kind = "RETURN"
helper = "exit-return.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "unit-return"
target = "advanced_game::unit"
kind = "RETURN"
helper = "unit-return.rs"
bindings = [{ name = "value", ty = "()", value = "$value" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "borrowed-return"
target = "advanced_game::borrowed"
kind = "RETURN"
helper = "borrowed-return.rs"
bindings = [{ name = "value", ty = "&i32", value = "$value" }]

[[injection]]
id = "owned-return"
target = "advanced_game::owned"
kind = "RETURN"
helper = "owned-return.rs"
bindings = [{ name = "value", ty = "String", value = "$value" }]

[[injection]]
id = "drop-return"
target = "advanced_game::drop_return"
kind = "RETURN"
helper = "drop-return.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }, { name = "trace", ty = "&Trace", value = "&trace" }]

[[injection]]
id = "argument-owned"
target = "advanced_game::arguments"
kind = "MODIFY_ARG"
helper = "argument-owned.rs"
selector = "sink"
require = 1
ordinal = 0
argument = 0
bindings = [{ name = "value", ty = "String", value = "$value" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "argument-number"
target = "advanced_game::arguments"
kind = "MODIFY_ARG"
helper = "argument-number.rs"
selector = "sink"
require = 1
ordinal = 0
argument = 1
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "argument-method"
target = "advanced_game::method_argument"
kind = "MODIFY_ARG"
helper = "argument-method.rs"
selector = "counter.apply"
require = 1
ordinal = 0
argument = 0
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "constant"
target = "advanced_game::constants"
kind = "MODIFY_CONSTANT"
helper = "constant.rs"
selector = "3"
require = 2
ordinal = 1
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "negative"
target = "advanced_game::constants"
kind = "MODIFY_CONSTANT"
helper = "negative.rs"
selector = "-2"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "string"
target = "advanced_game::text"
kind = "MODIFY_CONSTANT"
helper = "string.rs"
selector = "\"two words\""
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "&'static str", value = "$value" }]

[[injection]]
id = "bool"
target = "advanced_game::flag"
kind = "MODIFY_CONSTANT"
helper = "bool.rs"
selector = "true"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "bool", value = "$value" }]

[[injection]]
id = "char"
target = "advanced_game::character"
kind = "MODIFY_CONSTANT"
helper = "char.rs"
selector = "'x'"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "char", value = "$value" }]

[[injection]]
id = "float"
target = "advanced_game::float"
kind = "MODIFY_CONSTANT"
helper = "float.rs"
selector = "1.5f64"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "f64", value = "$value" }]

[[injection]]
id = "hex"
target = "advanced_game::hex"
kind = "MODIFY_CONSTANT"
helper = "hex.rs"
selector = "0x10u32"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "u32", value = "$value" }]

[[injection]]
id = "pattern"
target = "advanced_game::pattern"
kind = "MODIFY_CONSTANT"
helper = "pattern.rs"
selector = "3"
require = 2
ordinal = 1
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "array"
target = "advanced_game::array"
kind = "MODIFY_CONSTANT"
helper = "array.rs"
selector = "3"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "wrap-owned"
target = "advanced_game::wrapping"
kind = "WRAP_OPERATION"
helper = "wrap-owned.rs"
selector = "original_owned"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "String", value = "$arg0" }, { name = "trace", ty = "Trace", value = "$arg1" }, { name = "original", ty = "impl FnOnce(String, Trace) -> String", value = "$operation" }]

[[injection]]
id = "wrap-method"
target = "advanced_game::wrapping_method"
kind = "WRAP_OPERATION"
helper = "wrap-method.rs"
selector = "counter.apply_traced"
require = 1
ordinal = 0
bindings = [{ name = "counter", ty = "&mut Counter", value = "$receiver" }, { name = "value", ty = "i32", value = "$arg0" }, { name = "trace", ty = "Trace", value = "$arg1" }, { name = "original", ty = "impl FnOnce(&mut Counter, i32, Trace) -> i32", value = "$operation" }]

[[injection]]
id = "wrap-self"
target = "advanced_game::Counter::wrapped_self"
kind = "WRAP_OPERATION"
helper = "wrap-self.rs"
selector = "self.apply_traced"
require = 1
ordinal = 0
bindings = [{ name = "counter", ty = "&mut Counter", value = "$receiver" }, { name = "value", ty = "i32", value = "$arg0" }, { name = "trace", ty = "Trace", value = "$arg1" }, { name = "original", ty = "impl FnOnce(&mut Counter, i32, Trace) -> i32", value = "$operation" }]

[[injection]]
id = "skip"
target = "advanced_game::skipping"
kind = "WRAP_OPERATION"
helper = "skip.rs"
selector = "never_called"
require = 1
ordinal = 0
bindings = [{ name = "original", ty = "impl FnOnce() -> i32", value = "$operation" }]

[[injection]]
id = "combined-constant"
target = "advanced_game::combined"
kind = "MODIFY_CONSTANT"
helper = "combined-constant.rs"
selector = "2"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "combined-argument"
target = "advanced_game::combined"
kind = "MODIFY_ARG"
helper = "combined-argument.rs"
selector = "base"
require = 1
ordinal = 0
argument = 0
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "combined-wrap"
target = "advanced_game::combined"
kind = "WRAP_OPERATION"
helper = "combined-wrap.rs"
selector = "base"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "i32", value = "$arg0" }, { name = "original", ty = "impl FnOnce(i32) -> i32", value = "$operation" }]

[[injection]]
id = "combined-return"
target = "advanced_game::combined"
kind = "RETURN"
helper = "combined-return.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }]

[[injection]]
id = "combined-before"
target = "advanced_game::combined"
kind = "BEFORE_CALL"
helper = "combined-before.rs"
selector = "base"
require = 1
ordinal = 0
bindings = [{ name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]

[[injection]]
id = "nested-wrap"
target = "advanced_game::nested_wrap"
kind = "WRAP_OPERATION"
helper = "nested-wrap.rs"
selector = "base"
require = 1
ordinal = 0
bindings = [{ name = "value", ty = "i32", value = "$arg0" }, { name = "original", ty = "impl FnOnce(i32) -> i32", value = "$operation" }]
