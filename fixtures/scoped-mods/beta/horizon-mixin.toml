[mod]
id = "beta"
version = "0.1.0"
priority = 50

[[injection]]
id = "capture"
kind = "BEFORE_CALL"
target = "scoped_game::locals"
helper = "capture.rs"
bindings = [{ name = "value", ty = "&mut i32", value = "$local_mut:value:0" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]
selector = "tick"
require = 3
ordinal = 0

[[injection]]
id = "inner"
kind = "BEFORE_CALL"
target = "scoped_game::locals"
helper = "inner.rs"
bindings = [{ name = "value", ty = "&i32", value = "$local_ref:value:1" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]
selector = "tick"
require = 3
ordinal = 1

[[injection]]
id = "init"
kind = "MODIFY_VARIABLE"
target = "scoped_game::variables"
helper = "init.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]
variable = { name = "health", ordinal = 0, at = "STORE" }
require = 2
ordinal = 0

[[injection]]
id = "load"
kind = "MODIFY_VARIABLE"
target = "scoped_game::variables"
helper = "load.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }, { name = "log", ty = "&mut Vec<&'static str>", value = "&mut *log" }]
variable = { name = "health", ordinal = 0, at = "LOAD" }
require = 2
ordinal = 1

[[injection]]
id = "slice-constant"
kind = "MODIFY_CONSTANT"
target = "scoped_game::sliced"
helper = "slice-constant.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }]
selector = "2"
require = 1
ordinal = 0
slice = { from = { selector = "begin", require = 1, ordinal = 0 }, to = { selector = "end", require = 1, ordinal = 0 } }

[[injection]]
id = "tuple"
kind = "MODIFY_ARGS"
target = "scoped_game::jointly"
helper = "tuple.rs"
bindings = [{ name = "args", ty = "(String,i32,Trace)", value = "$args" }]
selector = "combine"
require = 1
ordinal = 0
result = "String"

[[injection]]
id = "method-tuple"
kind = "MODIFY_ARGS"
target = "scoped_game::method"
helper = "method-tuple.rs"
bindings = [{ name = "args", ty = "(i32,Trace)", value = "$args" }]
selector = "entity.add_traced"
require = 1
ordinal = 0
result = "i32"

[[bridge]]
id = "health"
kind = "GET"
target = "scoped_game::state::Entity"
member = "health"

[[bridge]]
id = "read-trait"
kind = "INVOKE"
target = "scoped_game::state::<Entity as Value>::value"

[[bridge]]
id = "tuple-field"
kind = "GET"
target = "scoped_game::state::Pair"
member = "0"
