[mod]
id="alpha"
version="0.1.0"
priority=100

[[injection]]
id="expression"
target="effects_game::expression"
kind="MODIFY_EXPRESSION_VALUE"
helper="expression.rs"
bindings=[{name="value",ty="i32",value="$value"},{name="trace",ty="&Trace",value="trace"}]
selector="add(number(trace),3)"
ordinal=0
require=1

[[injection]]
id="boolean"
target="effects_game::short"
kind="MODIFY_EXPRESSION_VALUE"
helper="boolean.rs"
bindings=[{name="value",ty="bool",value="$value"},{name="trace",ty="&Trace",value="trace"}]
selector="number(trace)>0"
ordinal=0
require=1

[[injection]]
id="nested"
target="effects_game::nested"
kind="AFTER_CALL"
helper="nested.rs"
bindings=[{name="value",ty="&mut i32",value="$result_mut"},{name="trace",ty="&Trace",value="trace"}]
result="i32"
selector="number"
ordinal=0
require=1

[[injection]]
id="before"
target="effects_game::before"
kind="BEFORE_CALL"
helper="before.rs"
bindings=[{name="cancel",ty="bool",value="cancel"},{name="trace",ty="&Trace",value="trace"}]
cancellable=true
selector="number"
ordinal=0
require=1

[[injection]]
id="return"
target="effects_game::before"
kind="RETURN"
helper="return.rs"
bindings=[{name="value",ty="i32",value="$value"}]

[[injection]]
id="after"
target="effects_game::discarded"
kind="AFTER_CALL"
helper="after.rs"
bindings=[{name="result",ty="&Token",value="$result_ref"},{name="cancel",ty="bool",value="cancel"},{name="trace",ty="&Trace",value="trace"}]
result="Token"
cancellable=true
selector="receiver(trace).produce"
ordinal=0
require=1

[[injection]]
id="assigned-first"
target="effects_game::assigned"
kind="AFTER_ASSIGN"
helper="assigned-first.rs"
bindings=[{name="value",ty="&i32",value="$local_ref:value:0"},{name="cancel",ty="bool",value="cancel"},{name="trace",ty="&Trace",value="trace"}]
cancellable=true
selector="number"
ordinal=0
require=2

[[injection]]
id="assigned-second"
target="effects_game::assigned"
kind="AFTER_ASSIGN"
helper="assigned-second.rs"
bindings=[{name="value",ty="&mut i32",value="$local_mut:value:0"},{name="trace",ty="&Trace",value="trace"}]
selector="number"
ordinal=1
require=2

[[injection]]
id="owned"
target="effects_game::after_owned"
kind="AFTER_ASSIGN"
helper="owned.rs"
bindings=[{name="text",ty="&mut String",value="$local_mut:text:0"}]
selector="String::from"
ordinal=0
require=1

[[injection]]
id="tick"
target="effects_game::state::Entity::tick"
kind="HEAD"
helper="tick.rs"
bindings=[{name="entity",ty="&mut Entity",value="self"}]

[[state]]
id="history"
target="effects_game::state::Entity"
ty="Vec<i32>"
initial="::core::default::Default::default()"
[[state.constructor]]
target="effects_game::state::Entity::new"
selector="Self"
require=1
[[state.constructor]]
target="effects_game::state::Entity::with_health"
selector="Self"
require=1
