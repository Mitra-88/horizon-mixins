[mod]
id="beta"
version="0.1.0"
priority=0

[[injection]]
id="expression"
target="effects_game::expression"
kind="MODIFY_EXPRESSION_VALUE"
helper="expression.rs"
bindings=[{name="value",ty="i32",value="$value"},{name="trace",ty="&Trace",value="trace"}]
selector="add(number(trace),3)"
ordinal=0
require=1

[[injection]]
id="after"
target="effects_game::discarded"
kind="AFTER_CALL"
helper="after.rs"
bindings=[{name="trace",ty="&Trace",value="trace"}]
result="Token"
selector="receiver(trace).produce"
ordinal=0
require=1

[[state]]
id="counter"
target="effects_game::state::Entity"
ty="usize"
initial="initial_counter()"
[[state.constructor]]
target="effects_game::state::Entity::new"
selector="Self"
require=1
[[state.constructor]]
target="effects_game::state::Entity::with_health"
selector="Self"
require=1
